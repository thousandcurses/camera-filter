<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Камера</title>
<style>
:root{--bg:#101214;--fg:#eef0f2;--mute:#8b929a;--ring:#f2f2f2;--accent:#ff4d3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#101214}}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;margin:10px 10px 0;border-radius:22px;overflow:hidden;background:#000}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#out{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.fx{position:absolute;top:12px;left:12px;z-index:2;padding:9px 16px;border-radius:999px;background:rgba(16,18,20,.6);backdrop-filter:blur(8px);font-size:.9rem}
.fx[aria-pressed="true"]{background:var(--accent)}
.msg{z-index:3;background:rgba(0,0,0,.55)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .25s ease-out}
@keyframes fl{from{opacity:.9}to{opacity:0}}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;line-height:1.4}
.msg p{margin:0;max-width:30ch;color:var(--mute)}
.msg h1{margin:0;font-size:1.5rem;font-weight:600}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.start{background:var(--fg);color:#101214;padding:14px 26px;border-radius:999px;font-weight:600}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 22px 18px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--ring);padding:5px;justify-self:center}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--ring);transition:transform .12s}
.shutter:active span{transform:scale(.86);background:var(--accent)}
.thumb{justify-self:start;width:52px;height:52px;border-radius:12px;background:#22262a center/cover;border:2px solid #2d3238}
.flip{justify-self:end;width:52px;height:52px;border-radius:50%;background:#22262a;display:grid;place-items:center}
.flip svg{width:24px;height:24px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gallery{position:fixed;inset:0;background:rgba(10,11,12,.96);display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;z-index:5}
.gallery.open{display:flex}
.gallery header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-content:start}
.grid a{display:block;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#22262a}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.hint{color:var(--mute);font-size:.85rem;margin:8px 0 0}
.close{padding:8px 14px;border-radius:999px;background:#22262a}
@media (prefers-reduced-motion:reduce){.flash.on{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="out"></canvas>
  <button class="fx" id="fx" aria-pressed="true">Эффект: вкл</button>
  <div class="flash" id="flash"></div>
  <div class="msg" id="msg">
    <h1>Камера</h1>
    <p>Нажми кнопку и разреши доступ к камере. Видео не уходит с твоего устройства.</p>
    <button class="start" id="start">Включить камеру</button>
  </div>
</div>
<div class="bar">
  <button class="thumb" id="thumb" aria-label="Открыть снимки"></button>
  <button class="shutter" id="shot" aria-label="Сделать снимок"><span></span></button>
  <button class="flip" id="flip" aria-label="Переключить камеру">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
  </button>
</div>
<div class="gallery" id="gal">
  <header><strong>Снимки</strong><button class="close" id="close">Закрыть</button></header>
  <div class="grid" id="grid"></div>
  <p class="hint">Нажми на снимок, чтобы открыть его и сохранить. Снимки хранятся только пока страница открыта.</p>
</div>
<script>
const v=document.getElementById('v'),msg=document.getElementById('msg'),flash=document.getElementById('flash'),
thumb=document.getElementById('thumb'),gal=document.getElementById('gal'),grid=document.getElementById('grid');
let stream=null,facing='environment',shots=[];

async function open(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=stream;await v.play();
    msg.style.display='none';
  }catch(e){
    msg.style.display='flex';
    msg.innerHTML='<h1>Нет доступа к камере</h1><p>Разреши камеру в настройках браузера для этой страницы и попробуй ещё раз. Если страница открыта внутри другого приложения, открой её в обычном браузере.</p><button class="start" id="retry">Попробовать снова</button>';
    document.getElementById('retry').onclick=open;
  }
}
document.getElementById('start').onclick=open;
document.getElementById('flip').onclick=()=>{facing=facing==='user'?'environment':'user';if(stream)open();};

document.getElementById('shot').onclick=()=>{
  if(!stream||!out.width)return;
  const url=out.toDataURL('image/jpeg',.92);
  shots.unshift(url);
  thumb.style.backgroundImage='url('+url+')';
  flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');
  if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
};

const out=document.getElementById('out'),octx=out.getContext('2d',{willReadFrequently:true});
let fx=true;
const fxBtn=document.getElementById('fx');
fxBtn.onclick=()=>{fx=!fx;fxBtn.setAttribute('aria-pressed',fx);fxBtn.textContent='Эффект: '+(fx?'вкл':'выкл');};

// Эффект: замкнутые области, ограниченные тёмными линиями (промежутки в проводах, оконные рамки),
// искажаются как стекло. Всё остальное остаётся обычным кадром.
let lw=0,lh=0,lum,dark,dk2,lab,alphaM,integ,stk,srcBuf;
function setup(W,H){
  lw=W>>1;lh=H>>1;const n=lw*lh;
  lum=new Uint8Array(n);dark=new Uint8Array(n);dk2=new Uint8Array(n);
  lab=new Int32Array(n);alphaM=new Float32Array(n);stk=new Int32Array(n);
  integ=new Uint32Array((lw+1)*(lh+1));srcBuf=new Uint8ClampedArray(W*H*4);
}
function frame(t){
  requestAnimationFrame(frame);
  if(!stream||!v.videoWidth)return;
  const vw=v.videoWidth,vh=v.videoHeight,s=640/Math.max(vw,vh),W=Math.round(vw*s),H=Math.round(vh*s);
  if(out.width!==W||out.height!==H){out.width=W;out.height=H;setup(W,H);}
  octx.setTransform(1,0,0,1,0,0);
  if(facing==='user'){octx.translate(W,0);octx.scale(-1,1);}
  octx.drawImage(v,0,0,W,H);
  octx.setTransform(1,0,0,1,0,0);
  if(!fx)return;
  const img=octx.getImageData(0,0,W,H),d=img.data,n=lw*lh;
  srcBuf.set(d);const src=srcBuf;
  // яркость в половинном разрешении + интегральное изображение
  const iw=lw+1;
  for(let y=0;y<lh;y++){
    let row=0;
    for(let x=0;x<lw;x++){
      const j=((y*2)*W+x*2)*4,l=(d[j]*.3+d[j+1]*.59+d[j+2]*.11)|0;
      lum[y*lw+x]=l;row+=l;
      integ[(y+1)*iw+x+1]=integ[y*iw+x+1]+row;
    }
  }
  // тёмные линии: темнее локального среднего или просто очень тёмные
  const R=5;
  for(let y=0;y<lh;y++){
    const y0=Math.max(0,y-R),y1=Math.min(lh,y+R+1);
    for(let x=0;x<lw;x++){
      const x0=Math.max(0,x-R),x1=Math.min(lw,x+R+1);
      const sum=integ[y1*iw+x1]-integ[y0*iw+x1]-integ[y1*iw+x0]+integ[y0*iw+x0];
      const mean=sum/((x1-x0)*(y1-y0)),l=lum[y*lw+x];
      dark[y*lw+x]=(l<mean*.8-3||l<38)?1:0;
    }
  }
  // расширяем линии на 1 пиксель, чтобы закрыть мелкие щели
  for(let y=0;y<lh;y++)for(let x=0;x<lw;x++){
    const i=y*lw+x;
    dk2[i]=(dark[i]||(x>0&&dark[i-1])||(x<lw-1&&dark[i+1])||(y>0&&dark[i-lw])||(y<lh-1&&dark[i+lw]))?1:0;
  }
  // связные области
  lab.fill(0);
  const area=[0],sx=[0],sy=[0];let L=0;
  for(let i0=0;i0<n;i0++){
    if(dk2[i0]||lab[i0])continue;
    L++;let sp=0,a=0,mx=0,my=0;stk[sp++]=i0;lab[i0]=L;
    while(sp){
      const i=stk[--sp],x=i%lw,y=(i-x)/lw;a++;mx+=x;my+=y;
      if(x>0&&!dk2[i-1]&&!lab[i-1]){lab[i-1]=L;stk[sp++]=i-1;}
      if(x<lw-1&&!dk2[i+1]&&!lab[i+1]){lab[i+1]=L;stk[sp++]=i+1;}
      if(y>0&&!dk2[i-lw]&&!lab[i-lw]){lab[i-lw]=L;stk[sp++]=i-lw;}
      if(y<lh-1&&!dk2[i+lw]&&!lab[i+lw]){lab[i+lw]=L;stk[sp++]=i+lw;}
    }
    area.push(a);sx.push(mx/a*2);sy.push(my/a*2);
  }
  const act=new Uint8Array(L+1);
  for(let k=1;k<=L;k++)act[k]=(area[k]>n*.004&&area[k]<n*.3)?1:0;
  // плавное появление/исчезновение
  for(let i=0;i<n;i++){const target=lab[i]&&act[lab[i]]?1:0;alphaM[i]+=(target-alphaM[i])*.35;}
  // искажение
  for(let y=0;y<H;y++){
    const ty=y/H,ly=y>>1;
    for(let x=0;x<W;x++){
      const i=ly*lw+(x>>1),a=alphaM[i];
      if(a<.03)continue;
      const l=lab[i];if(!l)continue;
      const cx=sx[l]*1,cy=sy[l]*1,dx=x-cx,dy=y-cy;
      const wob=Math.sin(t/700+dy*.045)*4;
      const sh=dy*.3;
      let o=(y*W+x)*4,rgb=[0,0,0];
      const ks=[.5,.55,.6];
      for(let c=0;c<3;c++){
        const k=ks[c];
        let u=cx+(dx+sh)*k+wob,w=cy+dy*k;
        u=u<0?0:u>W-1?W-1:u|0;w=w<0?0:w>H-1?H-1:w|0;
        rgb[c]=src[(w*W+u)*4+c];
      }
      // сине-розовый оттенок стекла
      const r=rgb[0]*.62+(70+185*ty)*.38,g=rgb[1]*.62+(120+20*ty)*.38,b=rgb[2]*.62+(225-95*ty)*.38;
      let rr=r,gg=g,bb=b;
      // светлая кромка у линий
      const edge=(i%lw>0&&!lab[i-1])||(i%lw<lw-1&&!lab[i+1])||(ly>0&&!lab[i-lw])||(ly<lh-1&&!lab[i+lw]);
      if(edge){rr+=60;gg+=65;bb+=70;}
      d[o]=src[o]*(1-a)+rr*a;d[o+1]=src[o+1]*(1-a)+gg*a;d[o+2]=src[o+2]*(1-a)+bb*a;
    }
  }
  octx.putImageData(img,0,0);
}
requestAnimationFrame(frame);

function render(){
  grid.innerHTML='';
  shots.forEach((u,i)=>{
    const a=document.createElement('a');a.href=u;a.download='foto-'+(shots.length-i)+'.jpg';
    const im=new Image();im.src=u;a.appendChild(im);grid.appendChild(a);
  });
}
thumb.onclick=()=>{render();gal.classList.add('open');};
document.getElementById('close').onclick=()=>gal.classList.remove('open');
</script>
</body>
</html>
